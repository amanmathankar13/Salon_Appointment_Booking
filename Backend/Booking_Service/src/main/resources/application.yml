server:
  port: 9004

spring:
    application:
        name: Booking_Service
    datasource:
        url: jdbc:mysql://localhost:3306/booking_db
        username: root
        password: aman@2005
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect

eureka:
    instance:
        prefer-ip-address: true
    client:
        fetch-registry: true
        register-with-eureka: true
        service-url:
            defaultZone: http://localhost:9006/eureka/
