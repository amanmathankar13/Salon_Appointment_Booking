    gateway:
        image: "amanmathankar/salon-gateway:v1"
        ports:
            - "9007:9007"
        healthcheck:
            test: [ "CMD-SHELL", "curl --fail --silent salon:9007/actuator/health/readiness | grep UP || exist 1" ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s
        container_name: gateway

        environment:
            SPRING_APPLICATION_NAME: "Gateway_Service"
            EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://serviceregistry:9006/eureka/
        deploy:
            resources:
                limits:
                    memory: 700m
        networks:
            - amanmathankar




networks:
    amanmathankar:
        driver: "bridge"