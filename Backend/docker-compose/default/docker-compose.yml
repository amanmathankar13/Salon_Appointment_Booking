            payment_db:
                condition: service_healthy
        environment:
            SPRING_APPLICATION_NAME: "Payment_Service"
            SPRING_DATASOURCE_URL: "jdbc:mysql://payment_db:3306/payment_db"
            SPRING_DATASOURCE_USERNAME: root
            SPRING_DATASOURCE_PASSWORD: aman@2005
            EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://serviceregistry:9006/eureka/


        deploy:
            resources:
                limits:
                    memory: 700m
        networks:
            - amanmathankar


    salon:
        image: "amanmathankar/salon-service:v1"
        ports:
            - "9001:9001"
        healthcheck:
            test: [ "CMD-SHELL", "curl --fail --silent salon:9001/actuator/health/readiness | grep UP || exist 1" ]
            interval: 10s
