        environment:
            SPRING_APPLICATION_NAME: "Service_Providing"
            SPRING_DATASOURCE_URL: "jdbc:mysql://services_db:3306/services_db"
            SPRING_DATASOURCE_USERNAME: root
            SPRING_DATASOURCE_PASSWORD: aman@2005
            EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://serviceregistry:9006/eureka/
        deploy:
