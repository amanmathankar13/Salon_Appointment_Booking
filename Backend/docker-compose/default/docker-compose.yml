        ports:
            - "9002:9002"
        healthcheck:
            test: [ "CMD-SHELL", "curl --fail --silent category:9002/actuator/health/readiness | grep UP || exist 1" ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s
        container_name: category
        depends_on:
            category_db:
                condition: service_healthy
        environment:
            SPRING_APPLICATION_NAME: "Category_Service"
            SPRING_DATASOURCE_URL: "jdbc:mysql://category_db:3306/category_db"
            SPRING_DATASOURCE_USERNAME: root
            SPRING_DATASOURCE_PASSWORD: aman@2005
            EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://serviceregistry:9006/eureka/


        deploy:
            resources:
                limits:
                    memory: 700m
        networks:
            - amanmathankar


    payment:
        image: "amanmathankar/salon-payment:v1"
        ports:
            - "9005:9005"
        healthcheck:
            test: [ "CMD-SHELL", "curl --fail --silent payment:9005/actuator/health/readiness | grep UP || exist 1" ]
