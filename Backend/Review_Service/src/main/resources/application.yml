spring:
  application:
    name: Review_Service
  datasource:
    url: jdbc:mysql://localhost:3306/review_db?createDatabaseIfNotExist=true
    username: root
    password: aman@2005
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:9006/eureka/

server:
  port: 9009